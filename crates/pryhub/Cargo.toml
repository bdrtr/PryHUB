[package]
name = "pryhub"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PryHUB — a Need for Speed: Underground 2 asset inspector: browse the chunk tree, read the bytes, and be told what looks wrong."

[dependencies]
# The parser, from this same workspace. PryHUB deliberately depends on nothing else: not the
# game that also reads these files (it lives in its own repo and takes `gizmo-nfs` as a
# dependency, the same way), and not the Gizmo engine — the engine owns its own window and
# loop, so embedding egui inside it would be backwards, and this tool must build without it.
# `png`: the export writes images through the library's encoder, so PryHUB and `ug2` cannot
# disagree about what a texture file should contain.
gizmo-nfs = { path = "../gizmo-nfs", features = ["png"] }
# egui 0.34.3 is what the workspace already locks; eframe 0.34.3 asks for exactly that
# (plus winit 0.30 / wgpu 29), so no duplicate toolkit tree is pulled in.
eframe = { version = "0.34.3", default-features = false, features = [
    "wgpu",       # the backend the workspace already builds (wgpu 29 / winit 0.30)
    "wayland",
    "x11",
    "default_fonts",
] }
egui = "0.34.3"
# The logging facade — no dependencies of its own, and the one `wgpu`, `winit` and `eframe` already
# write to, so installing a sink for it makes their diagnostics visible in the same stream.
log = "0.4"
# The 3D tab renders through eframe's own wgpu device; `bytemuck` is how vertex and uniform
# structs reach it without unsafe.
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }
# Marka PNG'sini çözmek için — kodlayıcısı `gizmo-nfs`'in `png` özelliğiyle zaten ağaçta,
# yani bu satır derlemeye yeni bir şey eklemiyor, sadece var olanı adıyla istiyor.
png = { workspace = true }

# No file-dialog crate: on Linux `rfd` drags in either GTK dev libraries or the xdg-portal +
# tokio stack, which is a heavy price for one button. A file arrives by drag-and-drop, by the
# path field on the welcome screen, or as argv[1] — the same way `ug2` takes one.
